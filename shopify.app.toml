# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a5fd4e148c2b1ca3e792f60dbe83cb5e"
name = "Unoir Studio"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

# Webhook subscriptions and privacy_compliance are managed in code via
# `shopify.server.ts` for local dev (`--use-localhost` cannot register
# webhooks against localhost). Re-add subscriptions in toml when shipping
# to production with a real public application_url.

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products"

[auth]
redirect_urls = [ "https://localhost:3458/auth/callback",
  "https://localhost:3458/auth/shopify/callback",
  "https://localhost:3458/api/auth/callback" ]
